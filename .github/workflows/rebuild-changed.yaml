# This workflow triggers a rebuild on COPR via webhook on spec file changes.

name: Rebuild on COPR
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  trigger-rebuild-on-modify:
    name: Trigger rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      build_id: ${{ steps.send-request.outputs.build_id }}
      build_url: ${{ steps.send-request.outputs.build_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for modification
        id: spec-modified
        uses: tj-actions/changed-files@v47
        with:
          files: codex.spec

      - name: Send rebuild request to COPR
        id: send-request
        env:
          URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [[ -n "${{ steps.spec-modified.outputs.modified_files }}" ]]; then
            echo "Spec file changed; sending rebuild request"
            BUILD_ID=$(curl -Ssf -X POST "$URL")
            BUILD_URL="https://copr.fedorainfracloud.org/coprs/build/$BUILD_ID"
            echo "Build submitted: $BUILD_URL"
            echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
            echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          fi

  report-status:
    name: Report build status
    needs: trigger-rebuild-on-modify
    runs-on: ubuntu-latest
    if: needs.trigger-rebuild-on-modify.outputs.build_id != ''
    steps:
      - name: Report status
        run: |
          echo "Monitoring build ${{ needs.trigger-rebuild-on-modify.outputs.build_url }}"
          while true; do
            STATUS=$(curl -Ssf "https://copr.fedorainfracloud.org/api_3/build/${{ needs.trigger-rebuild-on-modify.outputs.build_id }}" | jq -r '.state')
            case $STATUS in
              pending | starting | importing | imported | waiting | running)
                echo "Build is $STATUS. Querying again in 15s."
                sleep 15
                ;;
              succeeded | forked)
                echo "Build $STATUS."
                exit 0
                ;;
              failed | canceled | skipped)
                echo "Build $STATUS."
                exit 1
                ;;
              *)
                echo "COPR API reported unknown status: $STATUS."
                exit 2
                ;;
            esac
          done
